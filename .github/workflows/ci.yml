name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege for GITHUB_TOKEN. CI only reads the tree — it never pushes,
# comments or publishes — so a compromised dependency running during `npm ci`
# or the build cannot use the ambient token to write to the repo. Without this
# block the token's scope follows the repo default, which is often read+write.
permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Matches the `engines` field in package.json (Vite 8 / rolldown need
      # ^20.19 || >=22.12). Pinned to the major used locally so CI can't pass on
      # a runtime nobody develops against — `20` silently floated to whatever
      # 20.x was newest, which hid a local 20.11.1 that could not build at all.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs ESLint + the shader smoke test (scripts/smoke-shaders.mjs)
      - name: Lint + shader smoke test
        run: npm run lint

      # node --test, no test-runner dependency. Covers src/storage/ — the schema
      # validator and the v1 -> v2 migration, whose failure mode is silent data
      # loss on load rather than anything a build or a lint would notice.
      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
