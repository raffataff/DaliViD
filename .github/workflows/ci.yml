name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege for GITHUB_TOKEN. CI only reads the tree — it never pushes,
# comments or publishes — so a compromised dependency running during `npm ci`
# or the build cannot use the ambient token to write to the repo. Without this
# block the token's scope follows the repo default, which is often read+write.
permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs ESLint + the shader smoke test (scripts/smoke-shaders.mjs)
      - name: Lint + shader smoke test
        run: npm run lint

      - name: Production build
        run: npm run build
